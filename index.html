<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Remix InvoiceKilat - QRIS Dinamis &amp; Invoice Manager</title>
    <meta name="description" content="Aplikasi invoice bisnis siap hosting dan mobile PWA dengan generator QRIS dinamis otomatis dari QRIS statis DANA Bisnis, sinkronisasi antar perangkat, notifikasi real-time pembayaran WhatsApp &amp; Email, serta integrasi Google Spreadsheet." />
    <meta property="og:title" content="Remix InvoiceKilat - QRIS Dinamis &amp; Invoice Manager" />
    <meta property="og:description" content="Aplikasi invoice bisnis siap hosting dan mobile PWA dengan generator QRIS dinamis otomatis dari QRIS statis DANA Bisnis, sinkronisasi antar perangkat, notifikasi real-time pembayaran WhatsApp &amp; Email, serta integrasi Google Spreadsheet." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="InvoiceKilat" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('invoice_kilat_theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-100 selection:text-blue-900 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
