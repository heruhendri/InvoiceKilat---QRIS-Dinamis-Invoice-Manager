<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- Document / Invoice Body -->
  <rect x="120" y="100" width="272" height="312" rx="20" fill="#ffffff" />
  
  <!-- Invoice Top Accent Bar -->
  <path d="M 120 120 Q 120 100 140 100 L 372 100 Q 392 100 392 120 L 392 140 L 120 140 Z" fill="#0284c7" />
  
  <!-- Document Lines -->
  <rect x="156" y="166" width="120" height="16" rx="8" fill="#94a3b8" />
  <rect x="156" y="196" width="70" height="12" rx="6" fill="#cbd5e1" />
  
  <!-- QRIS stylized code on invoice -->
  <rect x="156" y="234" width="200" height="140" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  
  <!-- QR Corner Markers -->
  <rect x="176" y="254" width="36" height="36" rx="6" fill="#0f172a" />
  <rect x="184" y="262" width="20" height="20" rx="2" fill="#ffffff" />
  <rect x="190" y="268" width="8" height="8" fill="#0f172a" />

  <rect x="300" y="254" width="36" height="36" rx="6" fill="#0f172a" />
  <rect x="308" y="262" width="20" height="20" rx="2" fill="#ffffff" />
  <rect x="314" y="268" width="8" height="8" fill="#0f172a" />

  <rect x="176" y="318" width="36" height="36" rx="6" fill="#0f172a" />
  <rect x="184" y="326" width="20" height="20" rx="2" fill="#ffffff" />
  <rect x="190" y="332" width="8" height="8" fill="#0f172a" />

  <!-- Center QR elements -->
  <rect x="238" y="270" width="14" height="14" rx="2" fill="#2563eb" />
  <rect x="260" y="270" width="14" height="28" rx="2" fill="#0f172a" />
  <rect x="238" y="294" width="36" height="14" rx="2" fill="#2563eb" />
  <rect x="284" y="320" width="24" height="14" rx="2" fill="#0f172a" />
  <rect x="318" y="320" width="18" height="24" rx="2" fill="#2563eb" />

  <!-- Badge in corner: Instant Fast Lightning -->
  <circle cx="380" cy="380" r="44" fill="#f59e0b" filter="url(#shadow)"/>
  <path d="M 382 348 L 362 382 L 378 382 L 374 412 L 400 376 L 384 376 Z" fill="#ffffff" />
</svg>
